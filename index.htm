<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusiFind PRO</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #10101c;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #a58bff;
  font-size: 34px;
}

.subtitle {
  text-align: center;
  color: #aaa;
}

.search {
  display: flex;
  gap: 10px;
  margin: 30px 0 15px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #555;
  background: #24243a;
  color: white;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 13px;
  background: #8060ed;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.tabs {
  display: flex;
  gap: 10px;
}

.tabs button {
  flex: 1;
}

.box {
  background: #222238;
  padding: 17px;
  margin-top: 15px;
  border-radius: 12px;
}

.song {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #444;
  padding: 12px 0;
}

.song button {
  flex-shrink: 0;
}

.youtube {
  background: #e53935;
}

.remove {
  background: #44445c;
}

#message {
  color: #aaa;
  text-align: center;
  margin-top: 20px;
}

footer {
  text-align: center;
  color: #777;
  margin-top: 40px;
}

@media(max-width: 430px) {
  .search {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 MusiFind PRO</h1>

<p class="subtitle">
Sevimli qo‘shiqlaringizni toping
</p>

<div class="search">
  <input id="song" placeholder="Qo‘shiq yoki ijrochi nomi...">
  <button onclick="searchMusic()">Qidirish 🔍</button>
</div>

<div class="tabs">
  <button onclick="showFavorites()">❤️ Sevimlilar</button>
  <button onclick="clearSearch()">Bosh sahifa</button>
</div>

<div id="message">
Qo‘shiq nomini yozing va qidirishni boshlang.
</div>

<div class="box" id="results"></div>

<footer>
MusiFind PRO © 2026
</footer>

</div>

<script>

let favorites = JSON.parse(
  localStorage.getItem("musifind") || "[]"
);

function searchMusic() {

  let song = document.getElementById("song").value.trim();

  if (!song) {
    document.getElementById("message").textContent =
      "Avval qo‘shiq nomini yozing!";
    return;
  }

  let url =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(song + " official audio");

  window.open(url, "_blank");

  saveHistory(song);
}

function saveHistory(song) {

  if (!favorites.includes(song)) {
    favorites.push(song);

    localStorage.setItem(
      "musifind",
      JSON.stringify(favorites)
    );
  }
}

function showFavorites() {

  let box = document.getElementById("results");

  document.getElementById("message").textContent =
    "❤️ Sevimli qidiruvlaringiz";

  box.innerHTML = "";

  if (favorites.length === 0) {
    box.textContent = "Hozircha sevimlilar yo‘q.";
    return;
  }

  favorites.forEach((song, index) => {

    let row = document.createElement("div");
    row.className = "song";

    let name = document.createElement("span");
    name.textContent = song;

    let play = document.createElement("button");
    play.className = "youtube";
    play.textContent = "▶";
    play.onclick = () => {
      window.open(
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(song),
        "_blank"
      );
    };

    let remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "✖";
    remove.onclick = () => {
      favorites.splice(index, 1);
      localStorage.setItem(
        "musifind",
        JSON.stringify(favorites)
      );
      showFavorites();
    };

    row.append(name, play, remove);
    box.appendChild(row);
  });
}

function clearSearch() {
  document.getElementById("results").innerHTML = "";
  document.getElementById("song").value = "";
  document.getElementById("message").textContent =
    "Qo‘shiq nomini yozing va qidirishni boshlang.";
}

document.getElementById("song").addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") searchMusic();
  }
);

</script>

</body>
</html>
