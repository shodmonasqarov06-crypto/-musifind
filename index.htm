<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusiFind PRO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #10101c;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 750px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #9b7cff;
  font-size: 34px;
}

.subtitle {
  text-align: center;
  color: #aaa;
}

.search-box {
  display: flex;
  gap: 8px;
  margin: 25px 0;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #444;
  border-radius: 10px;
  background: #202033;
  color: white;
  font-size: 16px;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 9px;
  background: #8060ed;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  opacity: .7;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tabs button {
  flex: 1;
}

#status {
  text-align: center;
  color: #bbb;
  margin: 15px 0;
}

.card {
  display: flex;
  gap: 15px;
  align-items: center;
  background: #202033;
  padding: 13px;
  border-radius: 13px;
  margin-bottom: 13px;
}

.card img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 9px;
}

.info {
  flex: 1;
  min-width: 0;
}

.info h3 {
  margin: 0 0 7px;
  overflow-wrap: anywhere;
}

.info p {
  color: #aaa;
  margin: 5px 0;
  font-size: 14px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}

.actions button {
  font-size: 12px;
  padding: 9px;
}

.youtube {
  background: #e53935;
}

.favorite {
  background: #34344d;
}

audio {
  width: 100%;
  margin-top: 8px;
}

footer {
  text-align: center;
  color: #777;
  margin-top: 35px;
  font-size: 13px;
}

@media(max-width: 450px) {
  body {
    padding: 12px;
  }

  .search-box {
    flex-direction: column;
  }

  .card img {
    width: 85px;
    height: 85px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 MusiFind PRO</h1>
<p class="subtitle">Sevimli musiqalaringizni toping!</p>

<div class="search-box">
  <input id="query" placeholder="Qo‘shiq yoki ijrochi nomi...">
  <button onclick="searchMusic()">Qidirish</button>
</div>

<div class="tabs">
  <button onclick="showSearch()">Qidiruv</button>
  <button onclick="showFavorites()">❤️ Sevimlilar</button>
</div>

<div id="status">Musiqa nomini yozib, qidirishni boshlang.</div>
<div id="results"></div>

<footer>
  MusiFind PRO © 2026
</footer>

</div>

<script>
let currentResults = [];
let favorites = JSON.parse(
  localStorage.getItem("musifind_favorites") || "[]"
);

let requestNumber = 0;

function searchMusic() {
  const term = document.getElementById("query").value.trim();

  if (!term) {
    document.getElementById("status").textContent =
      "Avval musiqa nomini kiriting!";
    return;
  }

  const id = ++requestNumber;

  document.getElementById("results").innerHTML = "";
  document.getElementById("status").textContent =
    "🔎 Qidirilmoqda...";

  const callbackName =
    "musicCallback_" + Date.now() + "_" + id;

  const params = new URLSearchParams({
    term: term,
    country: "US",
    media: "music",
    entity: "song",
    limit: "25",
    callback: callbackName
  });

  const script = document.createElement("script");
  script.src =
    "https://itunes.apple.com/search?" + params.toString();

  let finished = false;

  const timer = setTimeout(() => {
    if (finished) return;

    finished = true;
    delete window[callbackName];
    script.remove();

    if (id === requestNumber) {
      document.getElementById("status").textContent =
        "Server javob bermadi. Birozdan keyin qayta urinib ko‘ring.";
    }
  }, 12000);

  window[callbackName] = function(data) {
    if (finished) return;

    finished = true;
    clearTimeout(timer);
    script.remove();
    delete window[callbackName];

    if (id !== requestNumber) return;

    currentResults = data.results || [];

    if (currentResults.length === 0) {
      document.getElementById("status").textContent =
        "Hech qanday musiqa topilmadi.";
      return;
    }

    document.getElementById("status").textContent =
      currentResults.length + " ta natija topildi.";

    renderSongs(currentResults);
  };

  script.onerror = function() {
    if (finished) return;

    finished = true;
    clearTimeout(timer);
    delete window[callbackName];
    script.remove();

    if (id === requestNumber) {
      document.getElementById("status").textContent =
        "Ulanishda xatolik. Keyinroq urinib ko‘ring.";
    }
  };

  document.body.appendChild(script);
}

function renderSongs(songs) {
  const box = document.getElementById("results");
  box.innerHTML = "";

  songs.forEach(song => {
    const saved = favorites.some(
      item => item.trackId === song.trackId
    );

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = song.artworkUrl100 || "";
    img.alt = "Albom rasmi";

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("h3");
    title.textContent = song.trackName || "Noma’lum qo‘shiq";

    const artist = document.createElement("p");
    artist.textContent = "Ijrochi: " + song.artistName;

    const album = document.createElement("p");
    album.textContent = "Albom: " +
      (song.collectionName || "Noma’lum");

    const actions = document.createElement("div");
    actions.className = "actions";

    const youtube = document.createElement("button");
    youtube.className = "youtube";
    youtube.textContent = "▶ YouTube";
    youtube.onclick = () => {
      const search = encodeURIComponent(
        song.trackName + " " + song.artistName
      );
      window.open(
        "https://www.youtube.com/results?search_query=" + search,
        "_blank"
      );
    };

    const fav = document.createElement("button");
    fav.className = "favorite";
    fav.textContent = saved ? "❤️ Saqlangan" : "♡ Saqlash";
    fav.onclick = () => toggleFavorite(song);

    actions.append(youtube, fav);
    info.append(title, artist, album, actions);

    if (song.previewUrl) {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = song.previewUrl;
      audio.preload = "none";
      info.appendChild(audio);
    }

    card.append(img, info);
    box.appendChild(card);
  });
}

function toggleFavorite(song) {
  const index = favorites.findIndex(
    item => item.trackId === song.trackId
  );

  if (index >= 0) {
    favorites.splice(index, 1);
  } else {
    favorites.push(song);
  }

  localStorage.setItem(
    "musifind_favorites",
    JSON.stringify(favorites)
  );

  renderSongs(currentResults);
}

function showFavorites() {
  currentResults = favorites;

  document.getElementById("status").textContent =
    favorites.length + " ta sevimli musiqa.";

  renderSongs(favorites);
}

function showSearch() {
  document.getElementById("results").innerHTML = "";
  document.getElementById("status").textContent =
    "Musiqa nomini yozib, qidirishni boshlang.";
}

document.getElementById("query").addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") searchMusic();
  }
);
</script>

</body>
</html>
